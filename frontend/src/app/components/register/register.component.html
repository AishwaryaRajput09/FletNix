<div class="relative min-h-screen flex items-center justify-center p-4"
  style="background-image: url('https://images.unsplash.com/photo-1440404653325-ab127d49abc1?q=80&w=1400'); background-size: cover; background-position: center;">

  <div class="absolute inset-0" style="background: rgba(10,8,6,0.7);"></div>

  <div class="relative z-10 w-full max-w-lg px-12 py-12"
    style="background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); border: 1px solid rgba(232,160,32,0.2); border-radius: 12px;">

    <div class="mb-8">
      <h1 class="text-4xl font-normal tracking-widest text-fletnix-accent font-display italic">FletNix</h1>
      <p class="text-white/50 text-sm italic mt-2">Create an account to explore the catalog.</p>
    </div>

    <h2 class="font-display text-3xl font-normal text-white mb-8">Create Account</h2>

    <form (ngSubmit)="onSubmit()" #registerForm="ngForm" class="space-y-5">

      <div>
        <label class="block text-fletnix-gray text-xs tracking-widest uppercase mb-2">Email</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-3 flex items-center pointer-events-none text-fletnix-gray">
            <svg lucideMail class="w-4 h-4"></svg>
          </span>
          <input type="email" name="email" [(ngModel)]="email" required email #emailInput="ngModel"
            placeholder="name@domain.com" class="fletnix-input w-full pl-10 pr-4 py-3 text-white"
            style="background: rgba(0,0,0,0.4); border-radius: 6px;" />
        </div>
        <p *ngIf="emailInput.invalid && (emailInput.dirty || emailInput.touched)" class="text-red-400 text-xs mt-1">
          Please enter a valid email.</p>
      </div>

      <div>
        <label class="block text-fletnix-gray text-xs tracking-widest uppercase mb-2">Password</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-3 flex items-center pointer-events-none text-fletnix-gray">
            <svg lucideLock class="w-4 h-4"></svg>
          </span>
          <input [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="password" required
            minlength="6" #passwordInput="ngModel" placeholder="••••••••"
            class="fletnix-input w-full pl-10 pr-10 py-3 text-white"
            style="background: rgba(0,0,0,0.4); border-radius: 6px;" />
          <button type="button" (click)="togglePasswordVisibility()"
            class="absolute inset-y-0 right-3 flex items-center text-fletnix-gray hover:text-white transition-colors duration-200">
            <svg *ngIf="showPassword" lucideEye class="w-4 h-4"></svg>
            <svg *ngIf="!showPassword" lucideEyeOff class="w-4 h-4"></svg>
          </button>
        </div>
        <p *ngIf="passwordInput.invalid && (passwordInput.dirty || passwordInput.touched)"
          class="text-red-400 text-xs mt-1">Password must be at least 6 characters.</p>
      </div>

      <div>
        <label class="block text-fletnix-gray text-xs tracking-widest uppercase mb-2">Date of Birth</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-3 flex items-center pointer-events-none text-fletnix-gray">
            <svg lucideCalendar class="w-4 h-4"></svg>
          </span>
          <input type="date" name="dob" [(ngModel)]="dob" (ngModelChange)="onDobChange($event)" required
            #dobInput="ngModel" [max]="maxDate" [min]="minDate" class="fletnix-input w-full pl-10 pr-4 py-3 text-white"
            style="background: rgba(0,0,0,0.4); border-radius: 6px; color-scheme: dark;" />
        </div>
        <p *ngIf="dobInput.invalid && (dobInput.dirty || dobInput.touched)" class="text-red-400 text-xs mt-1">Please
          enter your date of birth.</p>
      </div>

      <button type="submit" [disabled]="registerForm.invalid || isLoading"
        class="btn-outline-accent w-full flex items-center justify-center gap-2 py-3 px-4 text-sm tracking-widest uppercase text-fletnix-accent transition-all duration-200 mt-6 disabled:opacity-40 disabled:pointer-events-none">
        <app-spinner *ngIf="isLoading" spinnerClass="h-4 w-4"></app-spinner>
        <svg *ngIf="!isLoading" lucideUserPlus class="w-4 h-4"></svg>
        <span>{{ isLoading ? 'Creating account...' : 'Sign Up' }}</span>
      </button>
    </form>

    <div class="mt-8 pt-6" style="border-top: 1px solid rgba(255,255,255,0.05);">
      <p class="text-sm text-white/40">
        Already have an account?
        <a routerLink="/login"
          class="text-fletnix-accent hover:text-white transition-colors duration-200 ml-1 underline">Sign in</a>
      </p>
    </div>

  </div>
</div>
